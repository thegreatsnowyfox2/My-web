<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudStream Desktop Terminal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #eef2f7;
            color: #333333;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            background-color: #f3f6fa;
        }

        .sidebar-deck {
            width: 320px;
            background: linear-gradient(135deg, #1d2030 0%, #0c0d14 100%);
            padding: 30px 20px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            z-index: 2;
            box-shadow: 5px 0 30px rgba(0,0,0,0.1);
        }

        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .sidebar-section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8fa0dd;
            margin: 20px 0 10px 5px;
        }

        .playlist-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-radius: 12px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.2s;
            font-size: 14px;
            font-weight: 500;
        }

        .playlist-item.active {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .main-deck {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 40px;
            overflow: hidden;
        }

        .hero-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
            box-shadow: 0 10px 30px rgba(160, 175, 195, 0.15);
            border: 1px solid rgba(255,255,255,0.8);
            margin-bottom: 40px;
        }

        .hero-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .hero-icon-box {
            width: 65px;
            height: 65px;
            background: #a370f7;
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

        .hero-title {
            font-size: 22px;
            font-weight: 700;
            color: #1d2030;
            margin-bottom: 4px;
        }

        .hero-subtitle {
            font-size: 13px;
            color: #7e8da2;
        }

        .progress-block {
            flex: 1;
            max-width: 500px;
        }

        .progress-wrapper {
            width: 100%;
            background: #e4ebf5;
            height: 8px;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            background: #4d7cff;
            height: 100%;
            width: 0%;
            border-radius: 4px;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 160px));
            gap: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .grid-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(160, 175, 195, 0.12);
            border: 1px solid rgba(255,255,255,0.8);
            transition: transform 0.2s;
        }

        .grid-card:hover {
            transform: translateY(-4px);
        }

        .grid-card.active {
            background: #eef4ff;
            border-color: #4d7cff;
        }

        .card-icon-frame {
            width: 70px;
            height: 70px;
            background: #f0f4f8;
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: #2c3a4e;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hero-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .ctrl-btn {
            background: #f0f4f8;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #play-trigger {
            background: #1d2030;
            color: white;
            width: 55px;
            height: 55px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div id="app-container">
        
        <div class="sidebar-deck">
            <div class="header-nav">
                <span style="font-weight: 700; font-size: 16px; letter-spacing: 1px; color: #4d7cff;">CLOUD_STREAM</span>
            </div>
            
            <div class="sidebar-section-title">
                <span>PLAYLISTS</span>
            </div>

            <div class="playlist-container" id="playlist-mount"></div>
        </div>

        <div class="main-deck">
            
            <div class="hero-card">
                <div class="hero-info">
                    <div class="hero-icon-box" id="hero-art">🎵</div>
                    <div>
                        <div class="hero-title" id="current-title">Loading Hub...</div>
                        <div class="hero-subtitle" id="current-artist">Syncing stream deployment</div>
                    </div>
                </div>

                <div class="progress-block">
                    <div class="progress-wrapper" id="seek-timeline">
                        <div class="progress-fill" id="playback-progress"></div>
                    </div>
                </div>

                <div class="hero-controls">
                    <button class="ctrl-btn" id="prev-btn">⏮</button>
                    <button class="ctrl-btn" id="play-trigger">▶</button>
                    <button class="ctrl-btn" id="next-btn">⏭</button>
                </div>
            </div>

            <div class="items-grid" id="grid-mount"></div>
        </div>

    </div>

    <script>
        let playlists = [
            { id: "all", name: "All Tracks" }
        ];

        // --- MANIFEST TRACK CONFIGURATION ---
        // Change "song.mp3" to match whatever filename you upload to GitHub!
        let masterTracks = [
            { id: 1, title: "My Uploaded Track", artist: "iPad Storage", category: "all", icon: "💾", url: "./song.mp3" },
            { id: 2, title: "Cyber Sunset (Demo)", artist: "System Core", category: "all", icon: "🌅", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" }
        ];

        let activePlaylistId = 'all';
        let currentTrackIndex = 0;
        let isPlaying = false;
        const audio = new Audio();

        const gridMount = document.getElementById('grid-mount');
        const playlistMount = document.getElementById('playlist-mount');
        const heroArt = document.getElementById('hero-art');
        const currentTitle = document.getElementById('current-title');
        const currentArtist = document.getElementById('current-artist');
        const playTrigger = document.getElementById('play-trigger');
        const playbackProgress = document.getElementById('playback-progress');
        const seekTimeline = document.getElementById('seek-timeline');

        function renderSidebar() {
            playlistMount.innerHTML = '';
            playlists.forEach(p => {
                const item = document.createElement('div');
                item.classList.add('playlist-item');
                if (p.id === activePlaylistId) item.classList.add('active');
                item.innerHTML = `<span>📂 ${p.name}</span>`;
                playlistMount.appendChild(item);
            });
        }

        function renderTrackGrid() {
            gridMount.innerHTML = '';
            masterTracks.forEach((track, index) => {
                const card = document.createElement('div');
                card.classList.add('grid-card');
                if (index === currentTrackIndex) card.classList.add('active');

                card.innerHTML = `
                    <div class="card-icon-frame">${track.icon || '🎵'}</div>
                    <div class="card-title">${track.title}</div>
                    <div style="font-size:11px; color:#9aa8bd; margin-top:4px;">${track.artist}</div>
                `;
                card.addEventListener('click', () => selectTrack(index, true));
                gridMount.appendChild(card);
            });
        }

        function selectTrack(index, autostart = false) {
            if (masterTracks.length === 0) return;
            currentTrackIndex = index;
            const track = masterTracks[currentTrackIndex];

            audio.src = track.url;
            currentTitle.innerText = track.title;
            currentArtist.innerText = track.artist;
            heroArt.innerText = track.icon || '🎵';

            renderTrackGrid();

            if (autostart) {
                audio.play().catch(() => {});
                isPlaying = true;
                playTrigger.innerText = "⏸";
            } else {
                audio.pause();
                isPlaying = false;
                playTrigger.innerText = "▶";
            }
        }

        function togglePlayback() {
            if (masterTracks.length === 0) return;
            if (isPlaying) {
                audio.pause();
                playTrigger.innerText = "▶";
            } else {
                audio.play().catch(() => {});
                playTrigger.innerText = "⏸";
            }
            isPlaying = !isPlaying;
        }

        audio.addEventListener('timeupdate', () => {
            const pct = (audio.currentTime / (audio.duration || 1)) * 100;
            playbackProgress.style.width = `${pct}%`;
        });

        seekTimeline.addEventListener('click', (e) => {
            if (audio.duration) {
                audio.currentTime = (e.offsetX / seekTimeline.clientWidth) * audio.duration;
            }
        });

        playTrigger.addEventListener('click', togglePlayback);
        document.getElementById('next-btn').addEventListener('click', () => { selectTrack((currentTrackIndex + 1) % masterTracks.length, isPlaying); });
        document.getElementById('prev-btn').addEventListener('click', () => { selectTrack((currentTrackIndex - 1 + masterTracks.length) % masterTracks.length, isPlaying); });
        audio.addEventListener('ended', () => { document.getElementById('next-btn').click(); });

        renderSidebar();
        renderTrackGrid();
        selectTrack(0, false);
    </script>
</body>
</html>
